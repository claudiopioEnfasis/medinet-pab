name: MediNet PAB - CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medinet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-and-postgres:
    name: Test FastAPI + PostgreSQL (sin omisiones)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-security.txt
            requirements-browser.txt
      - name: Credenciales exclusivas para CI, generadas y enmascaradas
        run: python -m scripts.ci_checks prepare-env "$GITHUB_ENV"
      - name: Construir PostgreSQL corregido y preparar base desechable
        run: |
          docker build -f Dockerfile.postgres -t medinet-pab-db:ci .
          docker run -d --name medinet-ci --mount type=tmpfs,destination=/var/lib/postgresql/data -p 127.0.0.1:5432:5432 -e POSTGRES_USER -e POSTGRES_PASSWORD -e POSTGRES_DB --health-cmd 'pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"' --health-interval 2s --health-retries 30 medinet-pab-db:ci
          for _ in $(seq 1 60); do
            if [ "$(docker inspect --format '{{json .State.Health.Status}}' medinet-ci)" = '"healthy"' ]; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Dependencias de test y driver de PostgreSQL
        run: |
          python -m pip install --upgrade pip==26.2.2
          pip install -r requirements-dev.txt
      - name: Validar destino y aplicar Alembic antes de probar
        run: |
          python -m scripts.ci_checks validate-db
          DATABASE_URL="$TEST_DATABASE_URL" python -m scripts.migrate
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic check
      - name: Test completo con PostgreSQL real
        id: tests
        run: |
          mkdir -p reports
          python -m pytest -q --tb=short --junitxml=reports/pytest.xml
      - name: Gate obligatorio sin omisiones y con concurrencia presente
        if: always() && steps.tests.outcome != 'skipped'
        run: python -m scripts.ci_checks tests reports/pytest.xml
      - name: Comprobar que las pruebas preservan el esquema migrado
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic current
          DATABASE_URL="$TEST_DATABASE_URL" python -m alembic check
      - name: Seed PostgreSQL repetible sin duplicar registros
        run: |
          DATABASE_URL="$TEST_DATABASE_URL" python -c 'from scripts.seed_demo import seed; first = seed(); second = seed(); assert first["totales"] == second["totales"]; assert first["totales"]["cirugias"] == 12; assert not any(second["creados"].values())'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Detener PostgreSQL de pruebas
        if: always()
        run: |
          if docker container inspect medinet-ci >/dev/null 2>&1; then
            docker stop medinet-ci
          fi

  frontend:
    name: Build React + Security Scan npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-fund --no-audit
      - name: Compilar interfaz
        run: npm run build
      - name: Security SCA npm
        run: npm audit --audit-level=high

  sast-sca:
    timeout-minutes: 15
    name: Security Scan Python + validación YAML
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-security.txt
            requirements-browser.txt
      - name: Validar sintaxis del workflow
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -config-file .github/actionlint.yaml .github/workflows/*.yml
      - name: Validar scripts operativos
        run: docker run --rm -v "$PWD:/repo:ro" koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d /repo/scripts/backup.sh /repo/scripts/provision_runtime.sh /repo/deploy/deploy.sh /repo/deploy/dispatch.sh
      - name: Instalar herramientas fijadas
        run: |
          python -m pip install --upgrade pip==26.2.2
          pip install -r requirements-security.txt
          mkdir -p reports
      - name: Bandit SAST
        run: bandit -r app scripts -f json -o reports/bandit.json
      - name: Pip-audit SCA, incluyendo herramientas de desarrollo
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements-dev.txt -r requirements-browser.txt -r requirements-security.txt --format json --output reports/pip-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: python-security-results
          path: reports/*.json
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Security Scan secretos (historial y árbol actual)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Preparar reportes redactados
        run: mkdir -p reports
      - name: Gitleaks 8.30.1 historial completo disponible
        run: docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --log-opts='--all --full-history' --redact=100 --report-format json --report-path /reports/gitleaks-history.json
      - name: Gitleaks árbol actual (también archivos completos)
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f dir /repo --redact=100 --report-format json --report-path /reports/gitleaks-current.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: secret-scan-redacted
          path: reports/gitleaks-*.json
          if-no-files-found: warn
          retention-days: 14

  image-scan:
    timeout-minutes: 30
    name: Build Docker + Security Scan Trivy
    runs-on: ubuntu-24.04
    needs: [backend-and-postgres, frontend, sast-sca, secret-scan]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Construcción multi-stage backend
        run: docker build -t medinet-pab-api:ci .
      - name: Construcción multi-stage frontend
        run: docker build -t medinet-pab-web:ci ./frontend
      - name: Construcción PostgreSQL con gosu corregido
        run: docker build -f Dockerfile.postgres -t medinet-pab-db:ci .
      - name: Trivy 0.76.1, todas las severidades y tres imágenes
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
        run: |
          mkdir -p reports
          for service in api web db; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v medinet-trivy-cache:/root/.cache/ "$TRIVY_IMAGE" image --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL --ignore-unfixed=false --format json "medinet-pab-$service:ci" > "reports/trivy-$service.json"
          done
      - name: Gate Trivy HIGH/CRITICAL, incluidos avisos sin corrección
        run: python3 -m scripts.ci_checks trivy reports/trivy-api.json reports/trivy-web.json reports/trivy-db.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-security-results
          path: reports/trivy-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Conservar exactamente las imágenes que aprobaron Trivy
        run: |
          docker save medinet-pab-api:ci medinet-pab-web:ci medinet-pab-db:ci | gzip -1 > medinet-images.tar.gz
          sha256sum medinet-images.tar.gz > medinet-images.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scanned-images
          path: |
            medinet-images.tar.gz
            medinet-images.sha256
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    name: Publicar imágenes versionadas en GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [image-scan]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-images
      - name: Verificar y cargar imágenes escaneadas
        run: |
          sha256sum -c medinet-images.sha256
          gzip -dc medinet-images.tar.gz | docker load
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar las mismas imágenes por SHA sin reconstruir
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          for service in api web db; do
            target="$image_prefix-$service:sha-$GITHUB_SHA"
            docker tag "medinet-pab-$service:ci" "$target"
            docker push "$target"
          done
