# Composición EC2: entrega SSH restringida desde runner efímero de GitHub.
# Nginx público con TLS se configurará en v1.0. Por ahora solo loopback.
name: medinet-pab
services:
  db:
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-db:${POSTGRES_IMAGE_TAG:-${IMAGE_TAG:?Define IMAGE_TAG}}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configura .env en el servidor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura .env en el servidor}
      POSTGRES_DB: ${POSTGRES_DB:?Configura .env en el servidor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [private_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15
  api:
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-api:${IMAGE_TAG:?Define IMAGE_TAG}
    env_file:
      - path: .env.runtime
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      DB_HOST: db
      API_ROOT_PATH: /api
      JWT_SECRET: ${JWT_SECRET:?Configura .env en el servidor}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: {condition: service_healthy}
    networks: [private_db, front]
  maintenance:
    profiles: [maintenance]
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-api:${IMAGE_TAG:?Define IMAGE_TAG}
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?Configura .env en el servidor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura .env en el servidor}
      POSTGRES_DB: ${POSTGRES_DB:?Configura .env en el servidor}
    command: [python, -m, scripts.migrate]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: {condition: service_healthy}
    networks: [private_db]
  web:
    image: ${IMAGE_PREFIX:?Define IMAGE_PREFIX}-web:${IMAGE_TAG:?Define IMAGE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:3000:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api: {condition: service_healthy}
    networks: [front]
networks:
  private_db: {internal: true}
  front: {}
volumes:
  postgres_data: {}
