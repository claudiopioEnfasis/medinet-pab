name: medinet-pab
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: medinet-pab-db:0.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Debes completar POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes completar POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Debes completar POSTGRES_DB en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: .
    env_file:
      - path: .env.runtime
        required: false # El arranque falla si no se ha aprovisionado el rol.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    environment:
      DB_HOST: db
      API_ROOT_PATH: /api
      JWT_SECRET: ${JWT_SECRET:?Agrega JWT_SECRET en .env usando openssl rand -hex 32}
    ports:
      - "127.0.0.1:8000:8000" # local: no abierto a Internet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    networks:
      - private_db
      - front

  maintenance:
    profiles: [maintenance]
    build: .
    image: medinet-pab-api
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:?Completa .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Completa .env}
      POSTGRES_DB: ${POSTGRES_DB:?Completa .env}
    command: [python, -m, scripts.migrate]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db: {condition: service_healthy}
    networks: [private_db]

  web:
    build: ./frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080" # frontend disponible solo en este PC
    networks:
      - front


networks:
  private_db:
    internal: true
  front: {}
volumes:
  postgres_data: {}
